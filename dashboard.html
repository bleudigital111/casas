<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Mundo Digital Bleu</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background: #0b0e11;
      color: #e4e9f2;
      font-family: "Inter", sans-serif;
    }

    /* NAV */
    .navbar {
      background: linear-gradient(90deg, #0a2a43, #0d4e8c);
      padding: 1rem 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .navbar-brand img {
      height: 45px;
    }

    /* HERO SLIDER */
    .hero {
      height: 70vh;
      position: relative;
      overflow: hidden;
    }
    .hero-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .hero-slide.active {
      opacity: 1;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 2;
    }
    .hero-content {
      position: relative;
      z-index: 5;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
    }
    .hero-content h1 {
      font-size: 3rem;
      font-weight: 700;
    }

    /* FORM DASHBOARD */
    .dashboard-box {
      background: #11151c;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
    }
    .form-control {
      background: #1a1f27;
      border: 1px solid #2a3342;
      color: #e4e9f2;
    }
    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 10px #0d6efd63;
    }

    /* CARDS DE PROPIEDADES */
    .prop-card {
      background: #11151c;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.35);
      transition: .3s;
    }
    .prop-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.55);
    }
    .prop-card img{
      height: 200px;
      width: 100%;
      object-fit: cover;
    }

  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark d-flex justify-content-between align-items-center">
  <a class="navbar-brand" href="index.html">
    <img src="assets/img/logo.png" alt="Bleu Mundo Digital">
  </a>
  <button id="logoutBtn" class="btn btn-danger">Cerrar sesión</button>
</nav>

<!-- HERO SLIDER -->
<header class="hero">
  <div class="hero-overlay"></div>

  <div class="hero-slide active" style="background-image:url('https://images.unsplash.com/photo-1572120360610-d971b9d7767c');"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c');"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1568605114967-8130f3a36994');"></div>

  <div class="hero-content text-white">
    <h1>Administra tus propiedades con estilo profesional</h1>
    <p class="lead">Dashboard avanzado · Totalmente responsivo · Optimizado para ventas</p>
  </div>
</header>

<!-- DASHBOARD FORM -->
<div class="container py-5">
  <div class="dashboard-box">
    <h2 class="mb-4">Subir nueva propiedad</h2>

    <form id="houseForm">
      <input class="form-control mb-3" id="title" placeholder="Título de la propiedad" required>
      <input class="form-control mb-3" id="price" placeholder="Precio" required>
      <input class="form-control mb-3" id="location" placeholder="Ubicación" required>
      <input class="form-control mb-3" id="whatsapp" placeholder="WhatsApp de contacto" required>
      <textarea class="form-control mb-3" id="description" placeholder="Descripción" rows="3" required></textarea>
      <textarea class="form-control mb-3" id="features" placeholder="Accesorios, cocina, baños, patio..." rows="2"></textarea>

      <label class="text-light fw-bold mb-2">Imágenes (máx 10)</label>
      <input type="file" id="images" class="form-control mb-4" multiple accept="image/*" required>

      <button class="btn btn-primary px-4" type="submit">Guardar</button>
      <button class="btn btn-secondary px-4" type="button" id="clearBtn">Limpiar</button>
    </form>
  </div>

  <h3 class="mt-5 mb-3">Propiedades cargadas</h3>
  <div class="row" id="list"></div>
</div>

<script>
// HERO SLIDER AUTOMÁTICO
let index=0;
setInterval(()=>{
  const slides=document.querySelectorAll('.hero-slide');
  slides.forEach(s=>s.classList.remove('active'));
  index=(index+1)%slides.length;
  slides[index].classList.add('active');
},4000);
</script>

<script src="assets/js/app.js"></script>
</body>
</html>
