<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel='stylesheet' href='assets/css/styles.css'>
</head>
<body>
  <div class="container py-4">
    <h2>Dashboard — Subir Casas</h2>
    <button id="logoutBtn" class="btn btn-danger mb-3">Cerrar sesión</button>

    <form id="houseForm">
      <input class="form-control mb-2" id="title" placeholder="Título">
      <input class="form-control mb-2" id="price" placeholder="Precio">
      <input class="form-control mb-2" id="location" placeholder="Ubicación">
      <input class="form-control mb-2" id="whatsapp" placeholder="WhatsApp">
      <textarea class="form-control mb-2" id="description" placeholder="Descripción"></textarea>
      <textarea class="form-control mb-2" id="features" placeholder="Accesorios, cocina, baños, patio..."></textarea>
      <input type="file" id="images" class="form-control mb-2" multiple>
      <button class="btn btn-primary" type="submit">Guardar</button>
      <button class="btn btn-secondary" type="button" id="clearBtn">Limpiar</button>
    </form>

    <div class="row mt-4" id="list"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
